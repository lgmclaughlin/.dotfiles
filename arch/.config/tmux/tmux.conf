
set-environment -g TMUX_PLUGIN_MANAGER_PATH $HOME/.tmux/plugins

# tpm setup ---------------------------------------------------

set -g @plugin tmux-plugins/tpm
set -g @plugin tmux-plugins/tmux-resurrect
set -g @plugin $HOME/.config/tmux/plugins/tokyo-night-tmux

# theme -------------------------------------------------------

set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 1

# disable widgets ---------------------------------------------

set -g @tokyo-night-tmux_show_datetime 0
set -g @tokyo-night-tmux_show_music 0
set -g @tokyo-night-tmux_show_netspeed 0
set -g @tokyo-night-tmux_show_path 0
set -g @tokyo-night-tmux_show_battery_widget 0
set -g @tokyo-night-tmux_show_hostname 0

# icons -------------------------------------------------------

set -g @tokyo-night-tmux_terminal_icon 
set -g @tokyo-night-tmux_active_terminal_icon 

# load --------------------------------------------------------

run $HOME/.tmux/plugins/tpm/tpm
run $HOME/.tmux/plugins/tmux-resurrect/resurrect.tmux
run $HOME/.config/tmux/plugins/tokyo-night-tmux/tokyo-night.tmux

# theme overrides ---------------------------------------------

set-option -g message-style "bg=#7aa2f7,fg=#131313"

# status bar padding ------------------------------------------

set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status 2

# set ---------------------------------------------------------

set -s escape-time 0
set -g mouse on

# tmux save session to socket specific folder -----------------

run-shell 'TMUX_SOCKET=$(basename "${TMUX%%,*}"); \
tmux set-option -gq @resurrect-dir "$HOME/.tmux/session-saves/$TMUX_SOCKET"'

# tmux autosave sessions -------------------------------------------

run-shell -b '{
  while true; do
    sleep 180
    ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet
  done
}'

# tmux autorestore session for socket -------------------------

run-shell '{
  TMUX_SOCKET=$(basename "${TMUX%%,*}")
  SAVE_FILE="$HOME/.tmux/session-saves/$TMUX_SOCKET/last"
  if [ -f "$SAVE_FILE" ]; then
    ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh "$SAVE_FILE"
  fi
}'

# keybinds ----------------------------------------------------

set -g prefix M-e
unbind C-b

bind-key -n M-S-n new-window
bind-key -n M-S-m new-window -c "#{pane_current_path}"
bind-key -n M-S-l next-window
bind-key -n M-S-h previous-window
bind-key -n M-S-, new-session
bind-key -n M-S-c kill-window
bind-key -n M-S-[ swap-window -t -1 \; previous-window
bind-key -n M-S-] swap-window -t +1 \; next-window

bind-key -n 'M-S-;' switch-client -T jump
bind-key -T jump 0 select-window -t 0
bind-key -T jump 1 select-window -t 1
bind-key -T jump 2 select-window -t 2
bind-key -T jump 3 select-window -t 3
bind-key -T jump 4 select-window -t 4
bind-key -T jump 5 select-window -t 5
bind-key -T jump 6 select-window -t 6
bind-key -T jump 7 select-window -t 7
bind-key -T jump 8 select-window -t 8
bind-key -T jump 9 select-window -t 9
